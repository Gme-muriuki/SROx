name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Deny warnings in CI. Warnings are bugs waiting to happen.
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------ Job 1: Format check ---------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ------------------------------ Job 2: Clippy ----------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ------------------------------- Job 3: Test --------------------------
  test:
    name: Test (${{ matrix.build }})
    runs-on: ubuntu-latest
    needs: clippy

    strategy:
      fail-fast: false
      matrix:
        build:
          - debug
          - release

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.build }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.build }}-
            ${{ runner.os }}-cargo-

      - name: Run tests (debug)
        if: matrix.build == 'debug'
        run: cargo test --all-targets --all-features

      - name: Run tests (release)
        if: matrix.build == 'release'
        run: cargo test --all-targets --all-features --release

      - name: Build release binary
        if: matrix.build == 'release'
        run: cargo build --release

  # --------------------------- Job 4: Security audit ----------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Audit dependencies
        run: cargo audit

  # --------------------------- Job 5: Coverage -------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Cache tarpaulin binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ runner.os }}-v0.31

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --quiet

      - name: Generate coverage report
        run: |
          cargo tarpaulin \
            --all-features \
            --workspace \
            --timeout 120 \
            --out Xml \
            --output-dir coverage/
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Write coverage summary to PR
        run: |
          if [ -f coverage/cobertura.xml ]; then
            LINES=$(grep -oP 'line-rate="\K[^"]+' coverage/cobertura.xml | head -1)
            PCT=$(echo "$LINES * 100" | bc | xargs printf "%.1f")
            echo "### Coverage: ${PCT}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Coverage: report unavailable" >> $GITHUB_STEP_SUMMARY
          fi

  # -------------- Job 6: MSRV (Minimum Supported Rust Version) ----------
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build on MSRV
        run: cargo build --all-features

  # -------------------------- Final gate ------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, audit, msrv]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] ||
             [[ "${{ needs.clippy.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.audit.result }}" != "success" ]] ||
             [[ "${{ needs.msrv.result }}" != "success" ]]; then
             echo "One or more required jobs failed"
             exit 1
          fi
          echo "All required jobs passed."
