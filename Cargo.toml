[package]
name = "srox"
version = "0.1.0"
edition = "2024"
authors = ["James Muriuki <james.muriuki.dev@gmail.com>"]
build = "./srox-testlib/build.rs"

[dependencies]
tokio = { version = "1.51.1", features = ["full"] }
once_cell = "1.21.4"

# TLS
rcgen = "0.14.7"
tokio-rustls = "0.26.4"
rustls = {version = "0.23.37", features = ["ring"]}
rustls-pki-types = "1.14.0"
pem = "3.0.6"
rustls-webpki = "0.103.12"  


# HTTP parsing
httparse = "1.10.1"

# Observability
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = {version = "0.3.23", features = ["json", "env-filter"]}
opentelemetry = "0.31.0"
opentelemetry-otlp = {version = "0.31.1", features = ["grpc-tonic"]}
opentelemetry_sdk = "0.31.0"
prometheus = "0.14.0"

# Config
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
toml = "1.1.2"

# Utilities
anyhow = "1.0.102"
thiserror = "2.0.18"
bytes = "1.11.1"
uuid = {version = "1.23.1", features = ["v4"]}
memchr = "2.8.0"
serial_test = "3.4.0"
oneshot = "0.2.1"
tempfile = "3"

[dev-dependencies]
cargo-audit = "0.22.1"
rcgen = "0.14.7"
tokio-test = "0.4.5"
# Tests
srox-testlib = { path = "./srox-testlib" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

#

[workspace]
members = ["./srox-testlib"]
